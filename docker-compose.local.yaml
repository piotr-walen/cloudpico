version: '3.8'

services:
  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/local-broker.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/local-broker.passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/local-broker.acl:/mosquitto/config/acl:ro
      - mosquitto_data_local:/mosquitto/data
      - mosquitto_log_local:/mosquitto/log
      # CA certificates (to verify Let's Encrypt cert on the hosted broker)
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - cloudpico-local-network
    dns:
    - 1.1.1.1
    - 8.8.8.8


volumes:
  mosquitto_data_local:
  mosquitto_log_local:

networks:
  cloudpico-local-network:
    driver: bridge
    internal: false