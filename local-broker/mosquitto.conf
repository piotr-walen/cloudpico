# Mosquitto MQTT Broker Configuration - Local Broker
# This broker acts as an intermediary between BLE gateway and hosted broker

# General configuration
pid_file /mosquitto/data/mosquitto.pid
user mosquitto

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Network listeners
listener 1883
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Security
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

connection bridge-to-hosted
address mosquitto-hosted:1883
bridge_protocol_version mqttv311
bridge_insecure false
start_type automatic
cleansession true
notifications false
try_private false

remote_username bridge
remote_password your-bridge-password

topic stations/+/telemetry out 1
topic stations/+/health out 1

remote_clientid cloudpico-local-bridge
keepalive_interval 60
restart_timeout 30
