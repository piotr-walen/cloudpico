version: '3.8'


services:
  mosquitto-hosted:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-hosted-dev
    restart: unless-stopped
    ports:
      - "1885:1883"
      - "9002:9001"
    volumes:
      # Uses development configuration (no SSL/TLS)
      # Config/acl mounted rw so container entrypoint can chown for mosquitto user (avoids group warning)
      - ./hosted-broker/hosted-broker.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - ./hosted-broker/hosted-broker.passwd:/mosquitto/config/passwd:ro
      - ./hosted-broker/hosted-broker.acl:/mosquitto/config/acl:ro
      - mosquitto_data_hosted_dev:/mosquitto/data
      - mosquitto_log_hosted_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network

  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local-dev
    restart: unless-stopped
    ports:
      - "1884:1883"
      - "9003:9001"
    volumes:
      # Uses development configuration (no SSL/TLS, plain MQTT bridge)
      # Config/acl mounted rw so container entrypoint can chown (avoids read-only filesystem errors)
      - ./remote-broker/remote-broker.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - ./remote-broker/remote-broker.passwd:/mosquitto/config/passwd:ro
      - ./remote-broker/remote-broker.acl:/mosquitto/config/acl:ro
      - mosquitto_data_local_dev:/mosquitto/data
      - mosquitto_log_local_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network
    depends_on:
      - mosquitto-hosted

volumes:
  mosquitto_data_hosted_dev:
    driver: local
  mosquitto_log_hosted_dev:
    driver: local
  mosquitto_data_local_dev:
    driver: local
  mosquitto_log_local_dev:
    driver: local

networks:
  cloudpico-dev-network:
    driver: bridge
