version: '3.8'


services:
  mosquitto-hosted:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-hosted-dev
    restart: unless-stopped
    ports:
      - "1885:1883"
      - "9002:9001"

    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    secrets:
      - api_password
      - bridge_password

    volumes:
      - ./remote-broker/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - ./remote-broker/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./remote-broker/acl:/mosquitto/config/acl:ro
      - mosquitto_data_hosted_dev:/mosquitto/data
      - mosquitto_log_hosted_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network

  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local-dev
    restart: unless-stopped
    ports:
      - "1884:1883"
      - "9003:9001"

    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    secrets:
      - gateway_password

    volumes:
      - ./local-broker/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - ./local-broker/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./local-broker/acl:/mosquitto/config/acl:ro
      - mosquitto_data_local_dev:/mosquitto/data
      - mosquitto_log_local_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network
    depends_on:
      - mosquitto-hosted

secrets:
  api_password:
    file: ./secrets/mqtt_api_password
  bridge_password:
    file: ./secrets/mqtt_bridge_password
  gateway_password:
    file: ./secrets/mqtt_gateway_password

volumes:
  mosquitto_data_hosted_dev:
    driver: local
  mosquitto_log_hosted_dev:
    driver: local
  mosquitto_data_local_dev:
    driver: local
  mosquitto_log_local_dev:
    driver: local

networks:
  cloudpico-dev-network:
    driver: bridge
