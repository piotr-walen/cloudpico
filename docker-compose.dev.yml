version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - ./mosquitto/mosquitto.acl:/mosquitto/config/acl:ro
      - mosquitto_data_dev:/mosquitto/data
      - mosquitto_log_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network

volumes:
  mosquitto_data_dev:
    driver: local
  mosquitto_log_dev:
    driver: local

networks:
  cloudpico-dev-network:
    driver: bridge
