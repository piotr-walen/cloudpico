version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"

    volumes:
      - ./mosquitto/hosted-broker.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/hosted-broker.passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/hosted-broker.acl:/mosquitto/config/acl:ro

      # Mount ALL letsencrypt so live/ symlinks resolve to archive/
      - ./letsencrypt:/etc/letsencrypt

      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - cloudpico-network

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: cloudpico-server
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - HTTP_ADDR=:8080
      - STATIC_DIR=/app/static
      - SQLITE_DRIVER=sqlite3
      - SQLITE_PATH=/app/data/app.db
      - SQLITE_MAX_OPEN_CONNS=1
      - SQLITE_MAX_IDLE_CONNS=1
      - SQLITE_CONN_MAX_LIFETIME=0s
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=cloudpico-server
      - MQTT_USERNAME=server
      - MQTT_PASSWORD=${MQTT_SERVER_PASSWORD:-changeme}
      - MQTT_TOPIC=stations/+/telemetry
    volumes:
      - server_data:/app/data
    networks:
      - cloudpico-network

  nginx:
    image: nginx:alpine
    container_name: cloudpico-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      - cloudpico-network
    depends_on:
      - server

volumes:
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  server_data:
    driver: local

networks:
  cloudpico-network:
    driver: bridge