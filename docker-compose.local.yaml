services:
  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./local-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./local-broker/passwd:/mosquitto/config/passwd
      - ./local-broker/mosquitto.acl:/mosquitto/config/acl:ro
      - mosquitto_data_local:/mosquitto/data
      - mosquitto_log_local:/mosquitto/log
    networks:
      - cloudpico-local-network

volumes:
  mosquitto_data_local:
  mosquitto_log_local:

networks:
  cloudpico-local-network:
    driver: bridge
    internal: false
