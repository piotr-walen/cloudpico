{{ define "partials/history-chart.html" }}
<div id="history-chart-container" class="history-chart-container" hx-swap-oob="true">
  <div class="chart-controls">
    <button type="button" 
            id="axes-toggle" 
            class="secondary small"
            data-show-y-axes="{{ .ShowYAxes }}"
            hx-get="/partials/history"
            hx-target="#history-container"
            hx-swap="innerHTML"
            hx-include="#station-selector, #history-range"
            >{{ if .ShowYAxes }}Hide Y-Axes{{ else }}Show Y-Axes{{ end }}</button>
  </div>

  <script type="application/json" id="history-chart-data" 
    hx-get="/partials/history-chart-data" 
    hx-trigger="load, every 20s, change from:#station-selector, change from:#history-range, click from:#axes-toggle" 
    hx-swap="outerHTML" 
    hx-include="#station-selector, #history-range">{{ if .ChartReadingsJSON }}{{ .ChartReadingsJSON }}{{ else }}[]{{ end }}</script>
  <script id="history-chart-show-y-axes" type="text/plain">{{ .ShowYAxes }}</script>

  <div id="chart-area"></div>
</div>
{{ end }}
