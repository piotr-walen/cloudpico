# Mosquitto MQTT Broker Configuration (HOSTED)

# General configuration
pid_file /mosquitto/data/mosquitto.pid
user mosquitto

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Message settings (omit max_packet_size to use default; 0 is invalid in Mosquitto 2.x)
# message_expiry_interval 0

# Security
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT (optional)
listener 1883
protocol mqtt

# MQTT over TLS (public)
listener 8883
protocol mqtt
certfile /etc/letsencrypt/live/mqtt.nubecita.casa/fullchain.pem
keyfile  /etc/letsencrypt/live/mqtt.nubecita.casa/privkey.pem
tls_version tlsv1.2

