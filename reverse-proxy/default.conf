server {
  listen 80;
  server_name nubecita.casa www.nubecita.casa;

  # Redirect to HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name nubecita.casa www.nubecita.casa;

  # Let’s Encrypt certs (issued for nubecita.casa + www.nubecita.casa)
  ssl_certificate     /etc/letsencrypt/live/nubecita.casa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nubecita.casa/privkey.pem;

  # Reasonable TLS settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # API: proxy /api/* to backend server (strip /api prefix)
  location /api/ {
    proxy_pass http://server:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Web app: proxy everything else to frontend
  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}