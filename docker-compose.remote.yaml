version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"

    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    secrets:
      - api_password
      - bridge_password

    volumes:
      - ./remote-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./remote-broker/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - ./remote-broker/acl:/mosquitto/config/acl:ro

      # Mount ALL letsencrypt so live/ symlinks resolve to archive/
      - ./letsencrypt:/etc/letsencrypt

      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - cloudpico-network

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: cloudpico-api
    restart: unless-stopped
    expose:
      - "8080"
    secrets:
      - api_password
    environment:
      - APP_ENV=prod
      - LOG_LEVEL=info
      - HTTP_ADDR=:8080
      - STATIC_DIR=/app/static
      - SQLITE_DRIVER=sqlite3
      - SQLITE_PATH=/app/data/app.db
      - SQLITE_MAX_OPEN_CONNS=1
      - SQLITE_MAX_IDLE_CONNS=1
      - SQLITE_CONN_MAX_LIFETIME=0s
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=cloudpico-api
      - MQTT_USERNAME=api
      - MQTT_TOPIC=stations/+/telemetry
    volumes:
      - api_data:/app/data
    networks:
      - cloudpico-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cloudpico-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - cloudpico-network

  nginx:
    image: nginx:alpine
    container_name: cloudpico-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      - cloudpico-network
    depends_on:
      - api
      - web

secrets:
  api_password:
    file: ./secrets/mqtt_api_password
  bridge_password:
    file: ./secrets/mqtt_bridge_password

volumes:
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  api_data:
    driver: local

networks:
  cloudpico-network:
    driver: bridge