<!DOCTYPE html>
<html lang="en">
<head>
  {{ template "head" . }}
  <link rel="stylesheet" href="/static/css/uplot@1.6.32.min.css">
</head>
<body>
  {{ template "nav" . }}
  <main class="main">
    <section class="history">
        <h1>History</h1>
        <div class="page-nav-buttons">
          <button type="button" class="secondary small" onclick="window.location.href='/'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" /></svg>
            Go to Dashboard
          </button>
        </div>
        <p class="lead">Weather readings history.</p>
        {{ with . }}
        <div class="station-selector-wrapper">
          <label for="station-selector">Station</label>
          <select id="station-selector"
                  name="station_id"
                  class="station-selector"
                  hx-get="/partials/history"
                  hx-trigger="change"
                  hx-target="#history-container"
                  hx-swap="innerHTML"
                  hx-include="this">
            {{ range .Stations }}
            <option value="{{ .ID }}" {{ if eq $.SelectedStationID .ID }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
          </select>
        </div>
        {{ end }}
        <div class="history-section">
          <div class="history-header">
            <h2>History</h2>
            <div class="history-controls">
              <label for="history-range">Range</label>
              <select id="history-range" name="range" class="history-range">
                <option value="1h" {{ if eq $.SelectedRangeKey "1h" }}selected{{ end }}>1h</option>
                <option value="6h" {{ if eq $.SelectedRangeKey "6h" }}selected{{ end }}>6h</option>
                <option value="24h" {{ if eq $.SelectedRangeKey "24h" }}selected{{ end }}>24h</option>
                <option value="3d" {{ if eq $.SelectedRangeKey "3d" }}selected{{ end }}>3d</option>
                <option value="7d" {{ if eq $.SelectedRangeKey "7d" }}selected{{ end }}>7d</option>
                <option value="30d" {{ if eq $.SelectedRangeKey "30d" }}selected{{ end }}>30d</option>
              </select>
            </div>
          </div>


          <div id="history-chart-container" class="history-chart-container" hx-swap-oob="true">
            <div class="chart-controls">
              <button type="button" 
                      id="axes-toggle" 
                      class="secondary small"
                      data-show-y-axes="false">Show Y-Axes</button>
            </div>

            <script type="application/json" id="history-chart-data" 
              hx-get="/partials/history-chart-data" 
              hx-trigger="load, every 20s, change from:#station-selector, change from:#history-range" 
              hx-swap="outerHTML" 
              hx-include="#station-selector, #history-range">[]</script>

            <div id="chart-area"></div>
          </div>

          <div id="history-container"
               class="history-container"
               hx-get="/partials/history"
               hx-trigger="load, every 20s, change from:#station-selector, change from:#history-range"
               hx-swap="innerHTML"
               hx-include="#station-selector, #history-range">
            <p>Loading…</p>
          </div>
        </div>
      </section>

  </main>
  <script src="/static/js/uplot1.6.32@.min.js"></script>
  <script src="/static/js/history-chart.js"></script>
</body>
</html>
