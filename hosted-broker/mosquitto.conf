# Mosquitto MQTT Broker Configuration
# Copy this file to mosquitto/mosquitto.conf and customize as needed

# General configuration
pid_file /mosquitto/data/mosquitto.pid
user mosquitto

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

log_timestamp true

# Network listeners
listener 1883
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Message settings (omit max_packet_size to use default; 0 is invalid in Mosquitto 2.x)
# message_expiry_interval 0

# Security
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# NOTE: This is the HOSTED broker - it does NOT bridge to other brokers
# Local brokers bridge TO this broker (see local-broker/mosquitto.conf for bridge config)
# This broker receives messages from local broker bridges and serves them to the server
