version: '3.8'

services:
  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./local-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./local-broker/passwd:/mosquitto/config/passwd:ro
      - ./local-broker/acl:/mosquitto/config/acl:ro
      - mosquitto_data_local:/mosquitto/data
      - mosquitto_log_local:/mosquitto/log
      # CA certificates (to verify Let's Encrypt cert on the hosted broker)
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - cloudpico-local-network
    dns:
    - 1.1.1.1
    - 8.8.8.8

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: cloudpico-gateway-local
    restart: unless-stopped
    environment:
      - APP_ENV=dev
      - LOG_LEVEL=info
      - MQTT_BROKER=mosquitto-local
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=cloudpico-gateway
      - MQTT_USERNAME=${MQTT_GATEWAY_USERNAME:-gateway}
      - MQTT_PASSWORD=${MQTT_GATEWAY_PASSWORD:-your-gateway-password}
    volumes:
      # D-Bus system bus: required for BlueZ (gateway talks to host Bluetooth via D-Bus).
      # Mount at both paths: godbus looks for /var/run/dbus/system_bus_socket; host uses /run/dbus.
      - /run/dbus:/run/dbus:ro
      - /run/dbus:/var/run/dbus:ro
    # Bluetooth (BlueZ): gateway talks to host's BlueZ over D-Bus; privileged gives hardware access for BLE.
    # On host: sudo apt install bluez && sudo systemctl enable --now bluetooth
    privileged: true
    networks:
      - cloudpico-local-network
    depends_on:
      - mosquitto-local

volumes:
  mosquitto_data_local:
  mosquitto_log_local:

networks:
  cloudpico-local-network:
    driver: bridge
    internal: false