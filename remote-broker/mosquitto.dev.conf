# Mosquitto MQTT Broker Configuration (HOSTED) - Development
# Development version without SSL/TLS

# General configuration
pid_file /mosquitto/data/mosquitto.pid
user mosquitto

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Security
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Plain MQTT only (no TLS for development)
listener 1883
protocol mqtt
