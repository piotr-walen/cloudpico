# Mosquitto MQTT Broker Configuration - Local Broker
# This broker acts as an intermediary between BLE gateway and hosted broker

# General configuration
pid_file /mosquitto/data/mosquitto.pid
user mosquitto

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Network listeners (local plaintext)
listener 1883
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Security (local authz/authn)
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Bridge to hosted broker over TLS (MQTTS)
connection bridge-to-hosted
address mqtt.nubecita.casa:8883
bridge_protocol_version mqttv311

start_type automatic
cleansession true
notifications false
try_private false

remote_username bridge
remote_password your-bridge-password

# TLS verification (uses system CA bundle mounted from host)
bridge_insecure false
bridge_cafile /etc/ssl/certs/ca-certificates.crt

# Topics bridged out to hosted
topic stations/+/telemetry out 1
topic stations/+/health out 1

remote_clientid cloudpico-local-bridge
keepalive_interval 60
restart_timeout 30
