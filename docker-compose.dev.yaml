version: '3.8'


services:
  mosquitto-hosted:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-hosted-dev
    restart: unless-stopped
    ports:
      - "1885:1883"
      - "9001:9001"
    volumes:
      # Uses hosted-broker configuration (simulates production hosted broker)
      # Config/acl mounted rw so container entrypoint can chown for mosquitto user (avoids group warning)
      - ./hosted-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./hosted-broker/passwd:/mosquitto/config/passwd
      - ./hosted-broker/mosquitto.acl:/mosquitto/config/acl:ro
      - mosquitto_data_hosted_dev:/mosquitto/data
      - mosquitto_log_hosted_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network

  mosquitto-local:
    image: eclipse-mosquitto:2.0
    container_name: cloudpico-mosquitto-local-dev
    restart: unless-stopped
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      # Config/acl mounted rw so container entrypoint can chown (avoids read-only filesystem errors)
      - ./local-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./local-broker/passwd:/mosquitto/config/passwd
      - ./local-broker/mosquitto.acl:/mosquitto/config/acl:ro
      - mosquitto_data_local_dev:/mosquitto/data
      - mosquitto_log_local_dev:/mosquitto/log
    networks:
      - cloudpico-dev-network
    depends_on:
      - mosquitto-hosted

volumes:
  mosquitto_data_hosted_dev:
    driver: local
  mosquitto_log_hosted_dev:
    driver: local
  mosquitto_data_local_dev:
    driver: local
  mosquitto_log_local_dev:
    driver: local

networks:
  cloudpico-dev-network:
    driver: bridge
